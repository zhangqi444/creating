<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A picture blog">
  <!-- The family mark, from sheilazhang.org: a rounded square in the blue-to-
       violet gradient, at the same corner radius. What sits inside is this
       site's own — the hub wears its owner's initials, and this blog carries
       nobody's name, so it takes a picture instead.

       Drawn as a filled silhouette rather than an outline on purpose. The first
       version framed the picture in a thin stroke; it was handsome at 128px and
       an unreadable smudge at 16, which is the size a browser tab actually
       uses. Solid shapes with air between them survive down there. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b63c9" />
      <stop offset="1" stop-color="#6b4fc4" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)" />
  <circle cx="23" cy="23" r="5" fill="#ffffff" />
  <path d="M11 47 L26.5 26 L37 40 L42.5 32.5 L53 47 Z" fill="#ffffff" />
</svg>
