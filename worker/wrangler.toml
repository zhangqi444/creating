# The subscribe endpoint. Deployed separately from the site: `wrangler deploy`
# from this folder, not by the Pages workflow.
#
# It is NOT routed on creating.sheilazhang.org. A Worker route only fires on a
# proxied (orange) DNS record, and this domain's records must stay grey so
# GitHub Pages can verify it and issue the certificate. So the endpoint is the
# workers.dev address, called cross-origin, which is why the Worker answers
# preflights and sets access-control-allow-origin.

name = "creating-subscribe"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# The one origin allowed to post here.
SITE_ORIGIN = "https://creating.sheilazhang.org"

# Secrets are never written here. Set them once, from this folder:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_AUDIENCE_ID
